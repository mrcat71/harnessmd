name: release

on:
  push:
    tags: ["v*"]
  # Manual runs only build and validate artifacts, never publish.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: test + package + sign
    runs-on: ${{ vars.MACOS_RUNNER }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag and signing configuration
        id: metadata
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Support/Info.plist)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF" != "refs/tags/v$version" ]]; then
            echo 'Tag does not match Support/Info.plist' >&2
            exit 1
          fi
          test -n "$SPARKLE_PUBLIC_ED_KEY" || { echo 'Set SPARKLE_PUBLIC_ED_KEY repository variable' >&2; exit 1; }
          printf 'asset=harnessmd-%s-macos-%s\n' "$version" "$(uname -m)" >> "$GITHUB_OUTPUT"
      - name: Test
        run: swift test --disable-automatic-resolution --no-parallel
        env:
          NSUnbufferedIO: "YES"
      - name: Package and smoke-test ZIP and DMG
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: make package
      - name: Sign and verify appcast and checksums
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: make appcast
      - name: Upload verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: |
            dist/${{ steps.metadata.outputs.asset }}.zip
            dist/${{ steps.metadata.outputs.asset }}.dmg
            dist/appcast.xml
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ${{ vars.MACOS_RUNNER }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
          path: assets
      - name: Publish complete release as Latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd assets
          shasum -a 256 -c SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md harnessmd-*.zip harnessmd-*.dmg appcast.xml SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
