name: ci

on:
  push:
    branches: [main, "renovate/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test + bundle smoke
    # Fork code must never execute on a privileged self-hosted runner.
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork || vars.MACOS_RUNNER == 'macos-26'
    runs-on: ${{ vars.MACOS_RUNNER }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, test, and smoke-test packaged app
        run: make ci
      - name: Test release packaging with disposable signing keys
        run: bash scripts/test-release.sh
