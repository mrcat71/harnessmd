name: ci

on:
  push:
    branches: [main, "renovate/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test + bundle smoke
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, test, and smoke-test packaged app
        run: make ci
      - name: Test release packaging with disposable signing keys
        run: bash scripts/test-release.sh
